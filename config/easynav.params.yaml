maps_manager_node:
  ros__parameters:
    use_sim_time: true
    map_types: [drainy]
    drainy:
      freq: 0.5 
      plugin: drainy_maps_manager/DrainyMapsManager
      map_path: /home/juanscelyg/ws/drainy_ws/
      map_topic: /genz/local_map
      filter_min: 0.9
      filter_max: 1.1
      max_lenght: 150.0
      resolution: 0.5
      confidence_lenght: 1.0

planner_node:
  ros__parameters:
    use_sim_time: true
    planner_types: [drainy]
    drainy:
      freq: 1.0
      plugin: drainy_planner/DrainyPlanner
      robot_radius: 0.3
      clearance_distance: 0.2

