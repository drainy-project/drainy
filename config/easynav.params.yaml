controller_node:
  ros__parameters:
    use_sim_time: true
    controller_types: [dummy]
    dummy:
      rt_freq: 30.0 
      plugin: easynav_controller/DummyController
      cycle_time_nort: 0.01
      cycle_time_rt: 0.001

localizer_node:
  ros__parameters:
    use_sim_time: true
    localizer_types: [drainy]
    drainy:
      freq: 10.0
      plugin: drainy_localizer/DrainyLocalizer

maps_manager_node:
  ros__parameters:
    use_sim_time: true
    map_types: [dummy]
    dummy:
      freq: 5.0 
      plugin: easynav_maps_manager/DummyMapsManager

planner_node:
  ros__parameters:
    use_sim_time: true
    planner_types: [drainy]
    drainy:
      freq: 1.0
      plugin: drainy_planner/DrainyPlanner
      min_error: 0.5

