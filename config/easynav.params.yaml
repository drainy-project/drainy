controller_node:
  ros__parameters:
    use_sim_time: true
    controller_types: [drainy]
    drainy:
      freq: 10.0
      plugin: drainy_controller/DrainyController
      x_gain: 0.8
      y_gain: 0.8
      z_gain: 1.0
      yaw_gain: 1.0
      safety_radius: 1.0 

