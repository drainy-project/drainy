#     dummy:
#       freq: 1.0
#       plugin: easynav_planner/DummyPlanner
#       cycle_time_nort: 0.2
#       cycle_time_rt: 0.001

sensors_node:
  ros__parameters:
    use_sim_time: true
    forget_time: 0.5
    sensors: [rgbd]
    perception_default_frame: odom
    rgbd:
      topic: /depth_camera/points
      type: sensor_msgs/msg/PointCloud2

system_node:
  ros__parameters:
    use_sim_time: true  
    robot_frame: drainy_0
    position_tolerance: 0.1
    angle_tolerance: 0.05